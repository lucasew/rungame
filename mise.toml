[tools]
"ubi:lucasew/workspaced" = "0.2.2"
python = "3.12"

[tasks]
lint = "workspaced codebase lint"
fmt = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:placeholder"]
run = "echo placeholder test"

[tasks."test:python"]
run = "python3 -m unittest discover tests"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:placeholder"]
run = "echo placeholder codegen"

[tasks.install]
depends = ["install:*"]

[tasks."install:node"]
run = '''
if [ -f package-lock.json ]; then
    npm ci
elif [ -f yarn.lock ]; then
    yarn install --frozen-lockfile
elif [ -f pnpm-lock.yaml ]; then
    pnpm install --frozen-lockfile
elif [ -f bun.lockb ]; then
    bun install
elif [ -f package.json ]; then
    npm install
else
    echo "No package manager detected"
fi
'''

[tasks.ci]
depends = ["lint", "test"]
